steps:

# 1️⃣ Package application
- name: gcr.io/cloud-builders/gcloud
  entrypoint: bash
  args:
    - -c
    - |
      set -e
      echo "Creating deployment artifact..."

      tar \
        --warning=no-file-changed \
        --exclude=.git \
        --exclude=node_modules \
        --exclude=vendor \
        --exclude=release.tar.gz \
        -czf /tmp/release.tar.gz .
        
      mv /tmp/release.tar.gz ./release.tar.gz

# 2️⃣ Maintain current + previous artifact in bucket
- name: gcr.io/cloud-builders/gsutil
  entrypoint: bash
  args:
    - -c
    - |
      set -e

      BUCKET=gs://cloudbuild-artifact-bucket

      echo "Saving current artifact as previous version"
      gsutil cp $$BUCKET/esellerhub-2.0-backend/release.tar.gz $$BUCKET/esellerhub-2.0-backend/release_previous.tar.gz || true

      echo "Uploading new release"
      gsutil cp release.tar.gz $$BUCKET/esellerhub-2.0-backend/release.tar.gz

# 3️⃣ Deploy to VM
- name: gcr.io/cloud-builders/gcloud
  entrypoint: bash
  args:
    - -c
    - |
      set -e

      VMS=(
        "beta-internal:asia-south1-a"
      )

      for ITEM in "$${VMS[@]}"; do

        VM_NAME=$$(echo $$ITEM | cut -d: -f1)
        ZONE=$$(echo $$ITEM | cut -d: -f2)

        echo "================================="
        echo "Deploying to $$VM_NAME"
        echo "================================="

        gcloud compute ssh ubuntu@$$VM_NAME \
        --zone=$$ZONE \
        --tunnel-through-iap \
        --command='

        set -eEuo pipefail

        rollback() {

          echo "Deployment failed. Rolling back using previous artifact..."
          cd /home/ubuntu
          rm -rf /home/ubuntu/esellerhub-2.0-backend
          mkdir -p /home/ubuntu/esellerhub-2.0-backend

          echo "Downloading previous release"
          cd /home/ubuntu/esellerhub-2.0-backend
          gsutil cp gs://cloudbuild-artifact-bucket/esellerhub-2.0-backend/release_previous.tar.gz .

          echo "Extracting previous release"
          tar -xzf release_previous.tar.gz -C /home/ubuntu/esellerhub-2.0-backend
          rm -f release_previous.tar.gz

          echo "Restarting previous version"
          sudo bash /home/ubuntu/esellerhub-2.0-backend/deploy/code-deploy/app_start.sh

          echo "Rollback completed"
        }

        trap rollback ERR

        echo "Stopping existing containers"
        if [ -f /home/ubuntu/esellerhub-2.0-backend/deploy/code-deploy/app_stop.sh ]; then
          sudo bash /home/ubuntu/esellerhub-2.0-backend/deploy/code-deploy/app_stop.sh || true
        fi

        echo "Preparing deployment directory"
        sudo rm -rf /home/ubuntu/esellerhub-2.0-backend
        sudo mkdir -p /home/ubuntu/esellerhub-2.0-backend
        sudo chown ubuntu:ubuntu /home/ubuntu/esellerhub-2.0-backend
        cd /home/ubuntu/esellerhub-2.0-backend

        echo "Downloading new artifact"
        gsutil cp gs://cloudbuild-artifact-bucket/esellerhub-2.0-backend/release.tar.gz .

        echo "Extracting release"
        tar -xzf release.tar.gz
        rm -f release.tar.gz

        echo "Starting application"
        sudo bash /home/ubuntu/esellerhub-2.0-backend/deploy/code-deploy/app_start.sh

        echo "Waiting for health check to pass..."
        sudo bash /home/ubuntu/esellerhub-2.0-backend/deploy/code-deploy/health_status.sh
        '
      done

timeout: "1800s"

options:
  logging: CLOUD_LOGGING_ONLY
  pool:
    name: projects/tj-dev-service-prj/locations/asia-south1/workerPools/tj-build-workerpool