services:
  esellerhub-2.0-backend:
    restart: always
    build:
      context: ./
      dockerfile: ./deploy/docker-config/Dockerfile
    container_name: esellerhub-2.0-backend
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
    volumes:
      - .:/app
      - /app/node_modules
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5002/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tj-net

networks:
  tj-net:
    external: true
